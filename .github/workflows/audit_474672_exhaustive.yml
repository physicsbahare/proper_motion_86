name: Exhaustive epoch audit - 474672

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit_474672_exhaustive.yml'
      - 'scripts/exhaustive_two_candidate_epoch_audit.py'

permissions:
  contents: write

concurrency:
  group: exhaustive-candidate-474672
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      MPLBACKEND: Agg
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Exhaustively inspect every public NIRCam epoch
        run: |
          python scripts/exhaustive_two_candidate_epoch_audit.py \
            --catalog data/candidates_remaining19_090630.csv \
            --ids 474672 \
            --output results_474672_exhaustive
      - name: Upload complete evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exhaustive-epoch-audit-474672
          path: results_474672_exhaustive/
          if-no-files-found: error
          retention-days: 30
      - name: Commit results
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results_474672_exhaustive
          if git diff --cached --quiet; then
            echo 'No result changes to commit.'
          else
            git commit -m 'Save exhaustive epoch audit for 474672'
            git push origin HEAD:main
          fi
