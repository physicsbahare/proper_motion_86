name: 1651050 independent F444W/F356W compact-control PSF validation

on:
  push:
    branches:
      - 'plan/liu2026-minimal-astrometry-followups-20261108'
    paths:
      - '.github/workflows/audit_1651050_psf_field_controls.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  psf_controls:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e .
          python -m pip install "stpsf>=2.2,<3" "synphot>=1.6,<2"
      - name: Independent compact field-control centroid PSF comparisons, both epochs
        env:
          PYTHONUNBUFFERED: '1'
          MPLBACKEND: 'Agg'
        run: python -u scripts/audit_1651050_psf_field_controls.py --out results_1651050_psf_controls
      - name: Save all numerical fits and failure trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 1651050-independent-F444W-F356W-PSF-controls
          path: results_1651050_psf_controls/
          retention-days: 30
          if-no-files-found: warn
