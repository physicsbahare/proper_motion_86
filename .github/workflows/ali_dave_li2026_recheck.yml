name: Ali45 + Dave125 JWST proper-motion recheck (Li 2026)

on:
  workflow_dispatch:
  schedule:
    # 09:30 Taiwan time daily. A bounded batch, not 170 full CAL audits each day.
    - cron: '30 1 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/ali_dave_li2026_recheck.yml'
      - 'scripts/run_ali_dave_round_robin.py'
      - 'src/pm86/mahalanobis.py'
      - 'data/candidates_ali_cosmos2025_45.csv'

permissions:
  contents: write

# Do not allow overlapping scheduled batches to clobber each other's state.
concurrency:
  group: ali-dave-li2026-roll
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          pytest -q tests/test_mahalanobis.py

  batch:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        sample: [ali, dave125]
        slot: [0, 1, 2, 3, 4]
    env:
      MPLBACKEND: Agg
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Audit next candidate or check for new archive epochs
        run: |
          python scripts/run_ali_dave_round_robin.py \
            --sample ${{ matrix.sample }} \
            --slot ${{ matrix.slot }} \
            --slots-per-day 5 \
            --output-root round_robin_run
      - name: Store compact result plus per-epoch evidence (30 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: li2026-${{ matrix.sample }}-${{ matrix.slot }}
          path: round_robin_run/
          if-no-files-found: warn
          retention-days: 30

  aggregate:
    needs: batch
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download completed result bundles
        uses: actions/download-artifact@v4
        with:
          pattern: li2026-*
          path: downloaded
          merge-multiple: true
      - name: Merge statuses without hiding unresolved sources
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import shutil
          import pandas as pd

          root = Path('results_li2026_recheck')
          for sample, input_path in [
              ('ali', 'data/candidates_ali_cosmos2025_45.csv'),
              ('dave125', 'data/candidates_step3_magnitude_cut_strict_125.csv'),
          ]:
              cat = pd.read_csv(input_path)
              dst = root / sample
              dst.mkdir(parents=True, exist_ok=True)
              for path in Path('downloaded').rglob(f'{sample}/summary_*.json'):
                  shutil.copyfile(path, dst / path.name)

              rows = []
              for r in cat.itertuples(index=False):
                  cid = int(r.candidate_id)
                  path = dst / f'summary_{cid}.json'
                  row = json.loads(path.read_text()) if path.exists() else {}
                  row.setdefault('candidate_id', cid)
                  row.setdefault('ra_deg', float(r.ra_deg))
                  row.setdefault('dec_deg', float(r.dec_deg))
                  row.setdefault('pm_status', 'NOT_YET_RECHECKED')
                  row.setdefault('classification', 'NOT_YET_RECHECKED')
                  rows.append(row)

              table = pd.DataFrame(rows)
              table.to_csv(root / f'{sample}_all_status.csv', index=False)
              counts = table['classification'].value_counts(dropna=False)
              progress = sum(table['classification'] != 'NOT_YET_RECHECKED')
              complete = sum(table['classification'].isin(
                  ['MOVING','CONSISTENT_WITH_ZERO']))
              unresolved = sum(table['classification'].isin(
                  ['INSUFFICIENT_DATA','AMBIGUOUS','AMBIGUOUS_SYSTEMATICS','NOT_YET_RECHECKED']))
              lines = [
                  f'# {sample} covariance-aware proper-motion rechecks',
                  f'Candidate roster: {len(cat)} (DO NOT confuse Dave125 with an unverified 123-source subset).',
                  f'First-pass audits performed: {progress}/{len(cat)}.',
                  f'PM moving or consistent-with-zero: {complete}.',
                  f'Unresolved or not rechecked: {unresolved}.',
                  'The covariance-aware chi-square remains theoretical until JWST null-calibration.',
                  '',
                  '## Current classification counts',
                  *[f'- {k}: {v}' for k, v in counts.items()],
                  '',
                  'INSUFFICIENT_DATA is not a stationary result. No epochs means no PM.',
              ]
              (root / f'{sample}_progress.md').write_text('\n'.join(lines)+'\n')
              print('\n'.join(lines))
          PY
      - name: Commit compact status and candidate summaries
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results_li2026_recheck
          if git diff --cached --quiet; then
            echo 'No new scientific status.'
          else
            git commit -m 'Record Ali and Dave JWST covariance PM monitoring results'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
