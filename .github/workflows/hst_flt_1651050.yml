name: Original HST FLT third-epoch screening for 1651050

on:
  push:
    branches: [publication-pm-parallax-audit-20261008]
    paths:
      - '.github/workflows/hst_flt_1651050.yml'
      - 'scripts/audit_hst_flt_1651050.py'
      - 'tests/test_hst_flt_1651050.py'
      - 'scripts/triage_hst_1651050.py'
      - 'tests/test_triage_hst_1651050.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-hst-original:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          pip install -e .
          pip install pytest
      - name: Test HST screening gate
        run: python -m pytest -q tests/test_hst_flt_1651050.py tests/test_triage_hst_1651050.py
      - name: Screen original HST FLT/FLC exposures
        env:
          PYTHONPATH: .
        run: python -u scripts/audit_hst_flt_1651050.py --output publication_check/hst_original_flt_1651050
      - name: Deduplicate HST exposure aliases and triage anomalous forced signals
        if: success()
        env:
          PYTHONPATH: .
        run: |
          python -u scripts/triage_hst_1651050.py \
            --input publication_check/hst_original_flt_1651050/HST_ORIGINAL_PIXEL_SCREEN.csv \
            --output publication_check/hst_original_flt_1651050/triage
      - name: Upload original-pixel QA outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 1651050-HST-original-FLT-detectability-screen
          path: publication_check/hst_original_flt_1651050/
          retention-days: 90
