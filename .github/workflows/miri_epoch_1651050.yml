name: Original MIRI CAL third-epoch detectability for 1651050

on:
  push:
    branches: [publication-pm-parallax-audit-20261008]
    paths:
      - '.github/workflows/miri_epoch_1651050.yml'
      - 'scripts/audit_miri_third_epoch_1651050.py'
      - 'tests/test_miri_third_epoch.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-miri-cal-epochs:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: |
          python -m pip install -r requirements.txt
          pip install -e .
      - name: Validate forced MIRI aperture diagnostic
        run: python -m pytest -q tests/test_miri_third_epoch.py
      - name: Query five known public MIRI observations and inspect CAL pixel cutouts
        env:
          PYTHONPATH: .
        run: |
          python -u scripts/audit_miri_third_epoch_1651050.py --output publication_check/miri_third_epoch
      - name: Upload MIRI original CAL panels, raw pixels and conservative SNR
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 1651050-MIRI-original-CAL-third-epoch-exploration
          path: publication_check/miri_third_epoch/
          retention-days: 90
