name: Validate full-epoch galaxy-only astrometry
on:
  workflow_dispatch:
  push:
    branches: ['review/cross-filter-systematics-*']
    paths:
      - 'src/pm86/galaxy_full_epoch.py'
      - 'scripts/run_full_epoch_galaxy_null.py'
      - 'tests/test_galaxy_full_epoch.py'
      - '.github/workflows/test_galaxy_full_epoch.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: |
          pip install -r requirements.txt
          pip install -e .
      - run: pytest -q tests/test_galaxy_full_epoch.py
