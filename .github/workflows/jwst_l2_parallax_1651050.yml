name: JWST L2 Horizons parallax audit for 1651050

on:
  push:
    branches: [publication-pm-parallax-audit-20261008]
    paths:
      - '.github/workflows/jwst_l2_parallax_1651050.yml'
      - 'scripts/jwst_parallax_1651050.py'
      - 'tests/test_jwst_l2_parallax.py'
      - 'data/1651050_astrometric_epoch_manifest.csv'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jwst-ephemeris:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: |
          python -m pip install -r requirements.txt
          pip install -e .
      - name: Unit tests
        run: python -m pytest -q tests/test_jwst_l2_parallax.py
      - name: Query JWST Horizons barycentric position and report conditional motion
        env:
          PYTHONPATH: .
        run: |
          python -u scripts/jwst_parallax_1651050.py --output publication_check/jwst_parallax
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 1651050-JWST-L2-parallax-vectors-and-conditional-motion
          path: publication_check/jwst_parallax/
          retention-days: 90
