name: Real JWST original-frame held-out galaxy null
on:
  workflow_dispatch:
  push:
    branches: ['review/cross-filter-systematics-*']
    paths:
      - '.github/workflows/run_galaxy_original_frame_full_epoch.yml'
permissions:
  contents: read
jobs:
  original_registration_null:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        candidate: [387132, 1651050]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install scientific dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .
      - name: Run verified synthetic tests
        run: pytest -q tests/test_galaxy_original_frame_full_epoch.py
      - name: Run full-epoch real JWST CAL astrometric experiment
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python -u scripts/run_galaxy_null_original_frame.py \
            --candidate ${{ matrix.candidate }} \
            --out results_galaxy_original_frame_full_epoch
      - name: Preserve success and failure source-level diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-frame-heldout-galaxy-${{ matrix.candidate }}
          path: results_galaxy_original_frame_full_epoch/
          if-no-files-found: warn
          retention-days: 30
