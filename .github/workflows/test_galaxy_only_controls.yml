name: Test galaxy-only cross-filter leave-one-out astrometry
on:
  push:
    branches: ['review/cross-filter-systematics-*']
    paths:
      - 'scripts/evaluate_galaxy_only_controls.py'
      - 'tests/test_evaluate_galaxy_only_controls.py'
      - '.github/workflows/test_galaxy_only_controls.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas pytest
      - run: pytest -q tests/test_evaluate_galaxy_only_controls.py
