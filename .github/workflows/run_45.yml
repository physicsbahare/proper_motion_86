name: Independent PM audit of 45 candidates

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run_45.yml'
      - 'src/**'
      - 'scripts/**'
      - 'data/candidates_45.csv'
      - 'data/reference_282040_centroids.csv'
      - 'requirements.txt'
      - 'pyproject.toml'
      - 'tests/**'

permissions:
  contents: write

concurrency:
  group: pm86-main
  cancel-in-progress: true

jobs:
  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Run tests
        run: pytest -q

  audit:
    name: Audit shard ${{ matrix.shard }}
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    env:
      MPLBACKEND: Agg
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Run independent archive audit
        run: |
          python scripts/run_shard.py \
            --catalog data/candidates_45.csv \
            --shard ${{ matrix.shard }} \
            --n-shards 5 \
            --output shard_${{ matrix.shard }}
      - name: Upload shard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pm86-shard-${{ matrix.shard }}
          path: shard_${{ matrix.shard }}/
          if-no-files-found: error
          retention-days: 30

  aggregate:
    name: Aggregate, QC, and save results
    needs: audit
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download all available shard artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: pm86-shard-*
          path: downloaded_shards
          merge-multiple: false
      - name: Install aggregation dependencies
        run: |
          pip install pandas numpy
          pip install -e .
      - name: Aggregate scientific results
        run: |
          python scripts/aggregate_results.py \
            --input downloaded_shards \
            --output results
      - name: Audit 60 mas centroid tolerance
        run: |
          python scripts/audit_centroid_tolerance.py \
            --results results \
            --output results/centroid_tolerance \
            --tolerance-mas 60 \
            --reference-centroids data/reference_282040_centroids.csv
      - name: Verify coverage and candidate-level execution
        id: qc
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import pandas as pd

          expected = set(pd.read_csv('data/candidates_45.csv').candidate_id.astype(int))
          result_file = Path('results/ALL45_PM_AUDIT.csv')
          problems = []
          if not result_file.exists():
              got = set()
              errors = pd.DataFrame()
              df = pd.DataFrame()
              problems.append('Missing results/ALL45_PM_AUDIT.csv')
          else:
              df = pd.read_csv(result_file)
              got = set(pd.to_numeric(df['candidate_id'], errors='coerce').dropna().astype(int))
              errors = df[df.get('pm_status', pd.Series(index=df.index, dtype=object)).astype(str).eq('ERROR')]

          missing = sorted(expected - got)
          if missing:
              problems.append('Missing candidate summaries: ' + ', '.join(map(str, missing)))
          if len(errors):
              problems.append('Candidate-level execution errors: ' + ', '.join(errors.candidate_id.astype(int).astype(str)))

          coverage_error_candidates = []
          for path in Path('results/candidates').glob('candidate_*/product_coverage_audit.csv'):
              try:
                  audit = pd.read_csv(path)
              except Exception:
                  continue
              if 'status' not in audit.columns or audit.empty:
                  continue
              statuses = audit['status'].astype(str)
              if statuses.str.startswith('ERROR:').any() and not statuses.eq('COVERED').any():
                  try:
                      coverage_error_candidates.append(int(path.parent.name.split('_', 1)[1]))
                  except Exception:
                      pass
          coverage_error_candidates = sorted(set(coverage_error_candidates))
          if coverage_error_candidates:
              problems.append(
                  'Exposure-access failures with no successfully opened covering product: '
                  + ', '.join(map(str, coverage_error_candidates))
              )

          suspicious_no_cover = []
          if len(df):
              pair_found = df.get('pair_status', pd.Series(index=df.index, dtype=object)).astype(str).eq('PAIR_FOUND')
              n_early = pd.to_numeric(df.get('n_covering_early', pd.Series(index=df.index)), errors='coerce').fillna(0)
              n_late = pd.to_numeric(df.get('n_covering_late', pd.Series(index=df.index)), errors='coerce').fillna(0)
              bad = df[pair_found & ((n_early == 0) | (n_late == 0))]
              suspicious_no_cover = sorted(pd.to_numeric(bad['candidate_id'], errors='coerce').dropna().astype(int).tolist())

          lines = [
              '# Run quality control\n\n',
              f'Candidate summaries present: **{len(got)}/{len(expected)}**\n\n',
              f'Candidate-level `pm_status == ERROR` rows: **{len(errors)}**\n\n',
              f'Candidates with product-access errors and no COVERED product: **{len(coverage_error_candidates)}**\n\n',
              f'PAIR_FOUND candidates with zero covering exposures in at least one epoch: **{len(suspicious_no_cover)}**\n\n',
          ]
          if suspicious_no_cover:
              lines.append('PAIR_FOUND but zero-cover IDs: ' + ', '.join(map(str, suspicious_no_cover)) + '\n\n')
          if problems:
              lines.append('## Problems\n\n')
              lines.extend(f'- {p}\n' for p in problems)
          else:
              lines.append('No missing summaries, candidate-level errors, or hidden exposure-access failures were found.\n')
          Path('results/RUN_QC.md').write_text(''.join(lines), encoding='utf-8')

          ok = not problems
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'ok={str(ok).lower()}\n')
          print('QC OK:', ok)
          for p in problems:
              print('QC:', p)
          PY
      - name: Commit compact results and QC to repository
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results
          if git diff --cached --quiet; then
            echo 'No result changes to commit.'
          else
            git commit -m 'Save independent PM audit results, QC, and centroid tolerance audit'
            git push origin HEAD:main
          fi
      - name: Fail visibly if candidate-level execution errors remain
        if: steps.qc.outputs.ok != 'true'
        run: |
          echo 'Scientific run QC failed; see results/RUN_QC.md.'
          exit 1
